<!DOCTYPE html>
<html>

<head>
    <title>Contact - My Personal Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="outer">

        <div id="navbar"></div>


        <div class="contact">

            <h2>Contact Me</h2>

            <form>

                <input
                    type="text"
                    placeholder="Your Name"
                    required>

                <input
                    type="email"
                    placeholder="Your Email"
                    required>

                <textarea
                    rows="6"
                    placeholder="Your Message" required></textarea>

                <button
                    type="submit"
                    class="btn">
                    Send Message
                </button>

            </form>

        </div>

    </div>
    <script src="script.js"></script>

</body>

</html>
